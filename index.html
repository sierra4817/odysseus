<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector Inteligente - El Capital Invisible</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
    <!-- Background glows -->
    <div class="ambient-glow bg-glow-1"></div>
    <div class="ambient-glow bg-glow-2"></div>

    <div class="app-wrapper">
        <!-- Sidebar: Chapter List -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-area">
                    <span class="logo-icon">✨</span>
                    <h2>El Capital <span class="gold-text">Invisible</span></h2>
                </div>
                <button class="close-sidebar-btn" id="close-sidebar-mobile" aria-label="Cerrar menú">×</button>
            </div>
            <nav class="chapter-nav">
                <ul id="chapter-list">
                    <!-- Loaded dynamically from app.js -->
                </ul>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <button class="menu-toggle-btn" id="menu-toggle" aria-label="Ver capítulos">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="header-center">
                    <h1 id="current-chapter-title">Cargando Libro...</h1>
                </div>
                <div class="theme-switch-wrapper">
                    <button class="theme-toggle-btn" id="theme-toggle" title="Cambiar tema">
                        <span class="sun-icon">☀️</span>
                        <span class="moon-icon">🌙</span>
                    </button>
                </div>
            </header>

            <!-- E-Reader Pane -->
            <article class="reader-pane" id="reader-pane">
                <div class="reader-container" id="reader-container">
                    <!-- Text paragraphs loaded dynamically -->
                </div>
            </article>

            <!-- Bottom Glassmorphic Controller -->
            <footer class="player-bar">
                <div class="player-header">
                    <div class="mode-selector">
                        <button class="mode-btn active" id="mode-audio">🎧 Audio Real</button>
                        <button class="mode-btn" id="mode-tts">🗣️ Voz Sintética</button>
                    </div>
                </div>

                <div class="player-progress">
                    <div class="progress-bar-bg" id="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-bar-fill"></div>
                    </div>
                    <div class="progress-labels">
                        <span id="progress-percent">0:00 / 0:00</span>
                        <span id="progress-percentage-val">0%</span>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="voice-controls" id="voice-controls-container">
                        <label for="voice-select">Voz:</label>
                        <select id="voice-select" class="custom-select">
                            <option value="">Cargando voces del sistema...</option>
                        </select>
                    </div>

                    <div class="playback-buttons">
                        <button class="player-btn btn-secondary" id="btn-prev" title="Retroceder 10s">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        </button>
                        <button class="player-btn btn-primary btn-play-pause" id="btn-play-pause" title="Reproducir">
                            <svg class="play-svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            <svg class="pause-svg hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                        </button>
                        <button class="player-btn btn-secondary" id="btn-stop" title="Detener">
                            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
                        </button>
                        <button class="player-btn btn-secondary" id="btn-next" title="Adelantar 10s">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                        </button>
                    </div>

                    <div class="speed-controls">
                        <label for="speed-select">Velocidad:</label>
                        <select id="speed-select" class="custom-select">
                            <option value="0.75">0.75x</option>
                            <option value="1.0" selected>1.0x</option>
                            <option value="1.2">1.2x</option>
                            <option value="1.5">1.5x</option>
                            <option value="1.8">1.8x</option>
                            <option value="2.0">2.0x</option>
                        </select>
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <!-- Hidden native audio element -->
    <audio id="audio-element"></audio>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
